<!-- ═══════════════════════════════════════════════════════════════
     CSS — List-view styles (extracted from index.html <style> block)
═══════════════════════════════════════════════════════════════ -->
<style>
  /* ─── LIST PAGE ──────────────────────────────────────────── */
  #list-page {
    flex: 1;
    overflow-y: auto;
    min-width: 0;
    display: none;
    flex-direction: column;
  }
  #list-page.active { display: flex; }
  #record-page.active { display: block; }

  .lv-header {
    background: white;
    border-bottom: 1px solid var(--ai-border);
    padding: 14px 20px 0;
  }
  .lv-title-row {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 10px;
  }
  .lv-title { font-size: 18px; font-weight: 700; color: var(--ai-text); }
  .lv-count { font-size: 13px; color: var(--ai-text-m); margin-left: 8px; }
  .lv-actions { display: flex; gap: 8px; }

  .lv-filter-bar {
    display: flex; gap: 6px; padding: 10px 0 0;
    overflow-x: auto; flex-wrap: nowrap;
  }
  .lv-filter-bar::-webkit-scrollbar { height: 0; }
  .lv-filter-btn {
    white-space: nowrap; flex-shrink: 0;
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--ai-border); background: white;
    font-size: 12px; color: var(--ai-text-2); cursor: pointer;
    transition: all 0.15s;
  }
  .lv-filter-btn:hover { border-color: var(--ai-blue); color: var(--ai-blue); }
  .lv-filter-btn.active { background: var(--ai-blue); color: white; border-color: var(--ai-blue); }
  .lv-filter-btn.danger { border-color: #fca5a5; color: var(--ai-red); }
  .lv-filter-btn.danger:hover, .lv-filter-btn.danger.active { background: var(--ai-red); color: white; border-color: var(--ai-red); }
  .lv-filter-btn.amber { border-color: #fcd34d; color: var(--ai-amber); }
  .lv-filter-btn.amber:hover, .lv-filter-btn.amber.active { background: var(--ai-amber); color: white; border-color: var(--ai-amber); }

  .lv-body { padding: 16px 20px; }

  .lv-table-wrap {
    background: white; border-radius: 8px;
    border: 1px solid var(--ai-border);
    overflow: hidden;
    box-shadow: var(--ai-shadow-s);
  }
  .lv-table { width: 100%; border-collapse: collapse; }
  .lv-table th {
    background: #f8f9fb; font-size: 11px; font-weight: 600;
    color: var(--ai-text-m); text-transform: uppercase; letter-spacing: 0.5px;
    padding: 10px 14px; text-align: left;
    border-bottom: 1px solid var(--ai-border);
    white-space: nowrap;
  }
  .lv-table td {
    padding: 11px 14px; font-size: 12.5px; color: var(--ai-text);
    border-bottom: 1px solid var(--ai-border);
    vertical-align: middle;
  }
  .lv-table tr:last-child td { border-bottom: none; }
  .lv-table tr.lv-row:hover { background: var(--ai-blue-l); cursor: pointer; }
  .lv-opp-link { color: var(--ai-blue); font-weight: 500; text-decoration: none; }
  .lv-opp-link:hover { text-decoration: underline; }

  .exp-badge {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .exp-critical { background: #fee2e2; color: var(--ai-red); }
  .exp-warning  { background: #fff3cd; color: #92400e; }
  .exp-normal   { background: #d1fae5; color: #065f46; }
  .exp-late     { background: #f3f4f6; color: var(--ai-text-m); }
  .exp-overdue  { background: #fee2e2; color: var(--ai-red); border: 1px solid #fca5a5; }
  .exp-inprog   { background: #dbeafe; color: #1d4ed8; }

  .stage-pill {
    display: inline-block; padding: 2px 8px; border-radius: 12px;
    font-size: 11px; background: #f3f4f6; color: var(--ai-text-2);
  }
</style>

<script>
// ─── MOCK OPPORTUNITY LIST DATA ───────────────────────────────────────────────
// Today: 2026-03-24 — expiry dates set relative to this
const MOCK_OPPS = [
  { id:'op-1', name:'Autodesk Inc – AEC Collection Renewal',   account:'Autodesk Inc',       stage:'Propose',   owner:'Shubham',       closeDate:'2026-04-10', amount:38500, status:'active'    },
  { id:'op-2', name:'Adobe Systems – Creative Cloud Enterprise',account:'Adobe Systems',      stage:'Negotiate', owner:'Priya Sharma',   closeDate:'2026-04-20', amount:22400, status:'active'    },
  { id:'op-3', name:'Salesforce – Platform Subscription',       account:'Salesforce Inc',     stage:'Qualify',   owner:'James Wilson',   closeDate:'2026-05-05', amount:56750, status:'active'    },
  { id:'op-4', name:'Microsoft – Office 365 Business Suite',    account:'Microsoft Corp',     stage:'Develop',   owner:'Rachel Kim',     closeDate:'2026-06-15', amount:91200, status:'active'    },
  { id:'op-5', name:'Oracle – Database License Renewal',        account:'Oracle Corp',        stage:'Propose',   owner:'Tom Nguyen',     closeDate:'2026-09-15', amount:145000,status:'active'    },
  { id:'op-6', name:'SAP SE – ERP Suite Annual Renewal',        account:'SAP SE',             stage:'Won',       owner:'David Lee',      closeDate:'2026-03-30', amount:78300, status:'inprog'    },
  { id:'op-7', name:'IBM – Watson AI Platform Renewal',         account:'IBM Corporation',    stage:'Post Sale', owner:'Amy Park',       closeDate:'2026-02-28', amount:33600, status:'expired'   },
  { id:'op-8', name:'HP Inc – Device Management Suite',         account:'HP Inc',             stage:'Post Sale', owner:'Mike Torres',    closeDate:'2026-02-10', amount:18900, status:'expired'   },
];

function getExpiryDays(closeDate) {
  const today = new Date('2026-03-24');
  const close = new Date(closeDate);
  return Math.round((close - today) / 86400000);
}

function getExpBucket(opp) {
  if (opp.status === 'inprog') return 'inprog';
  const d = getExpiryDays(opp.closeDate);
  if (d < 0 && d >= -45) return d >= -30 ? 'pexp30' : 'pexp45';
  if (d >= 0 && d <= 30) return 'exp30';
  if (d > 30 && d <= 45) return 'exp45';
  if (d > 45 && d <= 90) return 'exp90';
  return 'gt90';
}

function expBadge(opp) {
  const d = getExpiryDays(opp.closeDate);
  if (opp.status === 'inprog') return `<span class="exp-badge exp-inprog">Order in Progress</span>`;
  if (d < 0) return `<span class="exp-badge exp-overdue">Expired ${Math.abs(d)}d ago</span>`;
  if (d <= 30) return `<span class="exp-badge exp-critical">${d} days</span>`;
  if (d <= 45) return `<span class="exp-badge exp-warning">${d} days</span>`;
  if (d <= 90) return `<span class="exp-badge exp-normal">${d} days</span>`;
  return `<span class="exp-badge exp-late">${d} days</span>`;
}

function renderOppList(filter) {
  const tbody = document.getElementById('opp-list-body');
  if (!tbody) return;
  let opps = MOCK_OPPS;
  if (filter && filter !== 'all') {
    opps = MOCK_OPPS.filter(o => getExpBucket(o) === filter);
  }
  tbody.innerHTML = opps.map(o => `
    <tr class="lv-row" onclick="openOpp('${o.id}')">
      <td><a class="lv-opp-link">${o.name}</a></td>
      <td>${o.account}</td>
      <td><span class="stage-pill">${o.stage}</span></td>
      <td>${o.owner}</td>
      <td>${o.closeDate}</td>
      <td>${expBadge(o)}</td>
      <td>USD ${o.amount.toLocaleString()}</td>
    </tr>
  `).join('');
}

function filterOppList(filter, btn) {
  document.querySelectorAll('.lv-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderOppList(filter);
}

function openOpp(id) {
  navigateTo('detail');
}

function toggleMoreExpiry() {
  const panel = document.getElementById('more-expiry-panel');
  const label = document.getElementById('more-expiry-label');
  const open  = panel.classList.toggle('open');
  label.textContent = open ? '− Less' : '+ More filters';
}

window.openOpp = openOpp;
window.filterOppList = filterOppList;
window.toggleMoreExpiry = toggleMoreExpiry;
